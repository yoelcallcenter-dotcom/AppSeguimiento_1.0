<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="%REACT_APP_CSP%"
    />
    <title>AppSeguimiento</title>
    <meta name="description" content="Sistema de gestión de casos ART: seguimiento de derivaciones, reportes, calendario de citas, notas y estadísticas. Funciona sin conexión." />
    <meta name="application-name" content="AppSeguimiento" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AppSeguimiento" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#0F172A" />
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/icons/icon-192.png" />
    <meta property="og:title" content="AppSeguimiento" />
    <meta property="og:description" content="Sistema de gestión de casos ART: seguimiento de derivaciones, reportes y estadísticas." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:image" content="%PUBLIC_URL%/icons/icon-512.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icons/icon-192.png" />
    <link rel="mask-icon" href="%PUBLIC_URL%/favicon.svg" color="#0F172A" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icons/apple-touch-icon.png" />
    <link
      rel="apple-touch-startup-image"
      href="%PUBLIC_URL%/icons/splash-1125x2436.png"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%PUBLIC_URL%/icons/splash-1170x2532.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%PUBLIC_URL%/icons/splash-1290x2796.png"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)"
    />
    <link
      rel="apple-touch-startup-image"
      href="%PUBLIC_URL%/icons/splash-2048x2732.png"
      media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)"
    />

    <style>
      /* Reset básico */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100vh;
        background-color: #0F172A;
      }

      #root {
        min-height: 100vh;
      }

      body {
        font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      }

      /* Variables CSS para temas */
      :root {
        --bg-primary: #0F172A;
        --bg-secondary: #161e2c;
        --bg-surface: #1b2333;
        --bg-surface2: #141b28;
        --bg-surface3: #111826;
        --bg-input: #101826;
        --text-primary: #e8e6df;
        --text-secondary: #8b93a7;
        --text-muted: #6b7385;
        --text-light: #9aa2b5;
        --border-color: #232d3f;
        --border-light: #2a3444;
        --border-input: #1e2634;
        --accent-color: #d9a441;
        --shadow-color: rgba(0, 0, 0, 0.4);
        --scrollbar-track: transparent;
        --scrollbar-thumb: #2a3444;
        --scrollbar-thumb-hover: #3a4558;
        --transition-speed: 0.3s;
      }

      /* Modo claro */
      body.light-mode {
        --bg-primary: #f0f2f5;
        --bg-secondary: #e8eaed;
        --bg-surface: #dde0e5;
        --bg-surface2: #e0e3e8;
        --bg-surface3: #e5e8ec;
        --bg-input: #ffffff;
        --text-primary: #1a1a2e;
        --text-secondary: #4a5068;
        --text-muted: #6b7385;
        --text-light: #8a92a5;
        --border-color: #c8cdd8;
        --border-light: #b8bdc8;
        --border-input: #d8dde8;
        --accent-color: #b8860b;
        --shadow-color: rgba(0, 0, 0, 0.1);
        --scrollbar-thumb: #c0c8d8;
        --scrollbar-thumb-hover: #a0a8b8;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background-color: var(--scrollbar-thumb);
        border-radius: 8px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--scrollbar-thumb-hover);
      }

      /* Utilidades */
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      /* Animations handled by globals.css - no duplicates here */

      /* Focus visible */
      *:focus-visible {
        outline: 2px solid var(--accent-color);
        outline-offset: 2px;
      }

      /* Placeholder */
      ::placeholder {
        color: var(--text-muted);
      }

      /* Input date */
      input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(0.6);
        cursor: pointer;
      }
      body.light-mode input[type="date"]::-webkit-calendar-picker-indicator {
        filter: invert(0.3);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .text-xs {
          font-size: 0.7rem;
        }
        .text-sm {
          font-size: 0.8rem;
        }
        .text-base {
          font-size: 0.9rem;
        }
        .text-lg {
          font-size: 1rem;
        }
        .text-xl {
          font-size: 1.1rem;
        }
        .p-6 {
          padding: 1rem;
        }
        .px-6 {
          padding-left: 1rem;
          padding-right: 1rem;
        }
        .gap-3 {
          gap: 0.5rem;
        }
      }

      /* Configuración */
      .config-section {
        border-radius: 0.5rem;
        padding: 1rem;
        background-color: var(--bg-secondary);
        border: 1px solid var(--border-color);
      }
      .config-section-title {
        font-size: 0.7rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-secondary);
        margin-bottom: 0.75rem;
      }

      /* Category tabs handled by globals.css */

      /* Botones */
      .btn-success {
        background-color: #10b981;
        color: #fff;
      }
      .btn-success:hover {
        opacity: 0.8;
      }
      .btn-danger {
        background-color: #ef4444;
        color: #fff;
      }
      .btn-danger:hover {
        opacity: 0.8;
      }
      .btn-warning {
        background-color: #fbbf24;
        color: #14181f;
      }
      .btn-warning:hover {
        opacity: 0.8;
      }

      /* Transitions handled by globals.css */
    </style>
  </head>
  <body>
    <script>
      /* Aplicar tema sincrónicamente antes del paint para evitar flash negro */
      try {
        var t = localStorage.getItem('app-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        var p = localStorage.getItem('app-palette');
        if (p) document.documentElement.setAttribute('data-palette', p);
      } catch(e) {}
    </script>
    <div id="root"></div>
  </body>
</html>
